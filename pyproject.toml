[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-mcp"
version = "1.0.0"
description = "MCP server for on-premises Atlassian Confluence Data Center"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "markdown>=3.7,<4",
    "markdownify>=0.14,<2",
    "mcp>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
confluence-mcp = "confluence_mcp.server:main"
confluence-mcp-review = "confluence_mcp.review:main"

[tool.setuptools.packages.find]
where = ["src"]
