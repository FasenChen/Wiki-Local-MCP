[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-readonly-mcp"
version = "0.2.0"
description = "Read-only MCP server for on-premises Atlassian Confluence Data Center"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "keyring>=25,<27",
    "markdown>=3.7,<4",
    "markdownify>=0.14,<2",
    "mcp>=1.26,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.scripts]
confluence-mcp = "confluence_mcp.server:main"
confluence-mcp-store-pat = "confluence_mcp.credentials:main"

[tool.setuptools.packages.find]
where = ["src"]
